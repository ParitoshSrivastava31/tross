services:
  - type: web
    name: linkedin-profile-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: ENABLE_SANDBOX_FALLBACK
        value: "true"
      - key: LI_AT_COOKIE
        sync: false
      - key: JSESSIONID
        sync: false
    healthCheckPath: /api/v1/health
